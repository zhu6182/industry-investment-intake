    <script>
      // 设备检测：手机自动跳 /mobile/home，PC 自动跳 /pc/dashboard
      (function() {
        var ua = navigator.userAgent.toLowerCase();
        var isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile|phone|harmonyos|hongmeng/.test(ua)
          || (navigator.maxTouchPoints > 0 && window.innerWidth < 768);
        var path = window.location.pathname;
        var hash = window.location.hash;
        var search = window.location.search;

        // 已在手机页或 PC 页的不跳（避免死循环）
        if (path.startsWith('/mobile/') || path.startsWith('/pc/') || path === '/index.html' || path.startsWith('/assets/') || path.startsWith('/map/')) {
          return;
        }

        var target = isMobile ? '/mobile/home' : '/pc/dashboard';
        // 保留登录后 redirect 参数
        if (search.indexOf('redirect=') > -1) {
          target += search;
        }
        window.location.replace(target + hash);
      })();
    </script>
