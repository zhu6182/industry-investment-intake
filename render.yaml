#################################################################
# Render Blueprint
# 产业投资进件系统 - Industry Investment Intake System
#################################################################
services:
  # 后端 NestJS API
  - type: web
    name: industry-investment-intake-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: uploads-disk
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: industry-investment-intake-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://industry-investment-intake-web.onrender.com
      - key: TYC_CACHE_TTL
        value: "604800"
      - key: TYC_REQUEST_TIMEOUT
        value: "15000"
    buildFilter:
      paths:
        - backend/**

  # 前端 Vue 3 Static Site
  - type: web
    name: industry-investment-intake-web
    runtime: static
    plan: starter
    region: singapore
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://industry-investment-intake-api.onrender.com
      - key: VITE_APP_TITLE
        value: 产业投资进件系统
    buildFilter:
      paths:
        - frontend/**

databases:
  - name: industry-investment-intake-db
    plan: starter
    region: singapore
    databaseName: industry_investment
    user: intake
    ipAllowList:
      - source: 0.0.0.0/0
        description: anywhere
