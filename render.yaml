#################################################################
# Render Blueprint
# 产业投资进件系统 - Industry Investment Intake System
#################################################################
services:
  # 后端 NestJS API (Docker)
  - type: web
    name: industry-investment-intake-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: industry-investment-intake-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://industry-investment-intake-web.onrender.com
    buildFilter:
      paths:
        - backend/**
        - Dockerfile
        - .gitignore

  # 前端 Vue 3 (Docker + nginx)
  - type: web
    name: industry-investment-intake-web
    runtime: docker
    plan: free
    region: singapore
    rootDir: .
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://industry-investment-intake-api.onrender.com
      - key: VITE_APP_TITLE
        value: 产业投资进件系统
    buildFilter:
      paths:
        - frontend/**
        - Dockerfile.frontend
        - .gitignore

databases:
  - name: industry-investment-intake-db
    plan: free
    region: singapore
    databaseName: industry_investment
    user: intake
    ipAllowList:
      - source: 0.0.0.0/0
        description: anywhere
