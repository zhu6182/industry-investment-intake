    <script>
      // 设备检测 + 强制跳转：手机访问任何 PC 页都跳手机版
      (function() {
        var ua = navigator.userAgent.toLowerCase();
        var isMobile = /android|webos|iphone|ipod|blackberry|iemobile|opera mini|mobile|phone|harmonyos|hongmeng|microMessenger|wechat|qq\//.test(ua)
          || (navigator.maxTouchPoints > 0 && Math.min(window.innerWidth, window.innerHeight) < 768);

        // iPad 也识别为平板，但屏幕大不强制跳
        var isTablet = /ipad|tablet/.test(ua);

        if (!isMobile || isTablet) return;

        var path = window.location.pathname;

        // 已经在手机页 → 不跳
        if (path.startsWith('/mobile/')) return;

        // 静态资源 → 不跳
        if (path.startsWith('/assets/') || path.startsWith('/map/') || path.endsWith('.svg') || path.endsWith('.png') || path.endsWith('.ico')) return;

        // PC 页转手机页：/pc/dashboard → /mobile/home
        // /pc/intakes → /mobile/intakes
        // /pc/bi → /mobile/bi
        var mobilePath = '/mobile/home';
        if (path.startsWith('/pc/')) {
          var rest = path.replace('/pc/', '');
          // 工作台 → 首页
          if (rest === 'dashboard' || rest === '') {
            mobilePath = '/mobile/home';
          } else if (rest === 'login') {
            mobilePath = '/mobile/login';
          } else if (rest === 'bi' || rest === 'bi2') {
            mobilePath = '/mobile/bi';
          } else if (rest.startsWith('intakes')) {
            mobilePath = '/mobile/intakes';
          } else if (rest.startsWith('follow-ups')) {
            mobilePath = '/mobile/follow-ups';
          } else if (rest.startsWith('visits')) {
            mobilePath = '/mobile/visits';
          } else if (rest.startsWith('referrals')) {
            mobilePath = '/mobile/referrals';
          }
          // 其他没对应手机页的，统一跳首页
        }

        window.location.replace(mobilePath + window.location.search + window.location.hash);
      })();
    </script>
